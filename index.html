<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pâti. World — 世界のパティシエ業界ニュース</title>
<meta name="description" content="フランス・ベルギー・イタリア・日本・アメリカ・イギリス、世界の菓子業界の最新トピックをAIが集め日本語で届けるニュースサイト。">
<script>
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
  window.addEventListener('pageshow', function(){ window.scrollTo(0, 0); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* layout: header -> sticky filter bar -> headline card grid -> footer */
    --bg: #F5F1EC;
    --bg-deep: #ECE4DA;
    --surface: #FFFDFB;
    --surface-2: #FBF6EF;
    --ink: #221C17;
    --ink-soft: #675C51;
    --ink-faint: #9C8F81;

    --framboise: #9B2C48;
    --framboise-ink: #6E1E33;
    --bleu: #2C5C7A;
    --bleu-ink: #1E4257;
    --or: #A9832E;
    --or-ink: #6E571C;

    --border: #E4D9CA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #17130F;
      --bg-deep: #0F0C09;
      --surface: #241E18;
      --surface-2: #2C241C;
      --ink: #F1E9DF;
      --ink-soft: #C9BAA8;
      --ink-faint: #8E7F6D;
      --framboise: #E08099;
      --framboise-ink: #F6CBD6;
      --bleu: #7FB4D6;
      --bleu-ink: #CFE4F0;
      --or: #D2AD5F;
      --or-ink: #EFD9A0;
      --border: #3A3023;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #17130F;
    --bg-deep: #0F0C09;
    --surface: #241E18;
    --surface-2: #2C241C;
    --ink: #F1E9DF;
    --ink-soft: #C9BAA8;
    --ink-faint: #8E7F6D;
    --framboise: #E08099;
    --framboise-ink: #F6CBD6;
    --bleu: #7FB4D6;
    --bleu-ink: #CFE4F0;
    --or: #D2AD5F;
    --or-ink: #EFD9A0;
    --border: #3A3023;
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  img{max-width:100%; display:block}

  .wrap{
    max-width:1040px; margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  header.top{
    background:var(--bg-deep); border-bottom:1px solid var(--border);
    padding-block:22px 18px;
  }
  .brand{
    font-family:'Bodoni Moda', serif; font-weight:700; font-size:1.9rem;
    letter-spacing:-0.01em; margin:0; display:flex; align-items:baseline; gap:.3em;
  }
  .brand .dot{color:var(--framboise)}
  .brand .world{color:var(--bleu); font-style:italic; font-weight:500}
  .tagline{
    margin:6px 0 0; font-size:.9rem; color:var(--ink-soft);
    font-family:'Space Mono', monospace; letter-spacing:.01em;
  }

  nav.filters{
    position:sticky; top:0; z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding-block:12px;
  }
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .filter-row + .filter-row{margin-top:8px}
  .chip{
    flex:none; font-family:'Work Sans', sans-serif; font-size:.82rem; font-weight:600;
    padding:7px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
  .chip .flag{margin-right:5px}

  main{padding-block:22px 48px}
  .count{
    font-family:'Space Mono', monospace; font-size:.78rem; color:var(--ink-faint);
    margin:0 0 14px;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 8px 20px -10px rgba(0,0,0,.25)}
  .card:focus-visible{outline:2px solid var(--framboise); outline-offset:2px}
  .card .thumb{
    width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--surface-2);
  }
  .card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1}
  .badges{display:flex; gap:6px; flex-wrap:wrap}
  .badge{
    font-family:'Space Mono', monospace; font-size:.68rem; letter-spacing:.02em;
    padding:2px 8px; border-radius:999px; font-weight:700;
  }
  .badge.country{background:var(--bleu); color:var(--surface)}
  .badge.cat{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border)}
  .card h2{
    font-family:'Bodoni Moda', serif; font-weight:700; font-size:1.08rem; line-height:1.4;
    margin:0; text-wrap:balance;
  }
  .card .summary{
    font-size:.86rem; color:var(--ink-soft); line-height:1.6; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .meta{
    margin-top:auto; display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono', monospace; font-size:.72rem; color:var(--ink-faint);
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
    font-family:'Space Mono', monospace; font-size:.85rem;
  }

  /* detail overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(10,8,6,.55); z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay[hidden]{display:none}
  .sheet{
    background:var(--surface); width:100%; max-width:640px; max-height:88vh;
    overflow-y:auto; border-radius:18px 18px 0 0;
    padding:0 0 max(24px, env(safe-area-inset-bottom,0px));
  }
  @media (min-width:640px){
    .overlay{align-items:center}
    .sheet{border-radius:18px; max-height:84vh}
  }
  .sheet .thumb{width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--surface-2)}
  .sheet-body{padding:20px 22px 4px}
  .sheet-close{
    position:sticky; top:10px; margin-left:calc(100% - 44px);
    width:34px; height:34px; border-radius:999px; border:none;
    background:rgba(20,16,12,.55); color:#fff; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:1;
  }
  .sheet h2{font-family:'Bodoni Moda', serif; font-size:1.5rem; line-height:1.4; margin:14px 0 10px; text-wrap:balance}
  .sheet .detail{font-size:.95rem; line-height:1.85; color:var(--ink); margin:0 0 18px}
  .sheet .src-link{
    display:inline-block; font-family:'Space Mono', monospace; font-size:.8rem;
    color:var(--framboise-ink); border-bottom:1px solid currentColor; margin-bottom:22px;
  }

  footer{
    border-top:1px solid var(--border); padding-block:24px;
    font-family:'Space Mono', monospace; font-size:.72rem; color:var(--ink-faint);
    text-align:center;
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="brand"><span class="name">P<span class="dot">â</span>ti.</span> <span class="world">World</span></p>
    <p class="tagline">世界の菓子業界ニュース、AIが毎日集めてお届け</p>
  </div>
</header>

<nav class="filters">
  <div class="wrap">
    <div class="filter-row" id="countryRow"></div>
    <div class="filter-row" id="catRow"></div>
  </div>
</nav>

<main class="wrap">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>該当する記事はまだありません。</p>
</main>

<footer>Pâti. World — フランス・ベルギー・イタリア・日本・アメリカ・イギリスの菓子業界情報をAIが翻訳・要約してお届けします</footer>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script>
const COUNTRIES = [
  {id:'all', label:'すべて'},
  {id:'france', label:'フランス', flag:'🇫🇷'},
  {id:'belgium', label:'ベルギー', flag:'🇧🇪'},
  {id:'italy', label:'イタリア', flag:'🇮🇹'},
  {id:'japan', label:'日本', flag:'🇯🇵'},
  {id:'usa', label:'アメリカ', flag:'🇺🇸'},
  {id:'uk', label:'イギリス', flag:'🇬🇧'},
];
const CATS = [
  {id:'all', label:'すべてのカテゴリ'},
  {id:'collection', label:'新作コレクション'},
  {id:'craft', label:'職人技'},
  {id:'people', label:'人物'},
  {id:'event', label:'コンクール・イベント'},
  {id:'design', label:'デザイン'},
];

let ARTICLES = [];
let activeCountry = 'all';
let activeCat = 'all';

function renderFilters(){
  const cRow = document.getElementById('countryRow');
  cRow.innerHTML = COUNTRIES.map(c => `
    <button class="chip" data-country="${c.id}" aria-pressed="${c.id===activeCountry}">
      ${c.flag ? `<span class="flag">${c.flag}</span>` : ''}${c.label}
    </button>`).join('');
  const kRow = document.getElementById('catRow');
  kRow.innerHTML = CATS.map(k => `
    <button class="chip" data-cat="${k.id}" aria-pressed="${k.id===activeCat}">${k.label}</button>`).join('');

  cRow.querySelectorAll('[data-country]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCountry = btn.dataset.country; renderFilters(); renderGrid(); });
  });
  kRow.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; renderFilters(); renderGrid(); });
  });
}

function countryLabel(id){
  const c = COUNTRIES.find(x=>x.id===id);
  return c ? c.label : id;
}
function catLabel(id){
  const k = CATS.find(x=>x.id===id);
  return k ? k.label : id;
}

function renderGrid(){
  const filtered = ARTICLES.filter(a =>
    (activeCountry==='all' || a.country===activeCountry) &&
    (activeCat==='all' || a.cat===activeCat)
  ).sort((a,b)=> b.addedAt.localeCompare(a.addedAt));

  document.getElementById('count').textContent = `${filtered.length}件の記事`;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if(filtered.length===0){
    grid.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  grid.innerHTML = filtered.map((a,i) => `
    <article class="card" tabindex="0" role="button" data-idx="${ARTICLES.indexOf(a)}">
      ${a.image ? `<img class="thumb" src="${a.image}" alt="" loading="lazy">` : ''}
      <div class="body">
        <div class="badges">
          <span class="badge country">${countryLabel(a.country)}</span>
          <span class="badge cat">${catLabel(a.cat)}</span>
        </div>
        <h2>${a.title}</h2>
        <p class="summary">${a.summary}</p>
        <div class="meta"><span>${a.source}</span><span>${a.addedAt}</span></div>
      </div>
    </article>
  `).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    const open = ()=> openDetail(ARTICLES[card.dataset.idx]);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });
  });
}

function openDetail(a){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <button class="sheet-close" id="sheetClose" aria-label="閉じる">✕</button>
    ${a.image ? `<img class="thumb" src="${a.image}" alt="">` : ''}
    <div class="sheet-body">
      <div class="badges">
        <span class="badge country">${countryLabel(a.country)}</span>
        <span class="badge cat">${catLabel(a.cat)}</span>
      </div>
      <h2>${a.title}</h2>
      <p class="detail">${a.detail}</p>
      <a class="src-link" href="${a.url}" target="_blank" rel="noopener">原文を読む(${a.source})↗</a>
    </div>
  `;
  overlay.hidden = false;
  document.getElementById('sheetClose').addEventListener('click', closeDetail);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDetail(); }, {once:true});
}
function closeDetail(){
  document.getElementById('overlay').hidden = true;
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeDetail();
});

fetch('articles.json')
  .then(r=>r.json())
  .then(data=>{
    ARTICLES = data;
    renderFilters();
    renderGrid();
  })
  .catch(()=>{
    document.getElementById('count').textContent = '';
    document.getElementById('empty').hidden = false;
    document.getElementById('empty').textContent = '記事データの読み込みに失敗しました。';
  });
</script>

</body>
</html>
