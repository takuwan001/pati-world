<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pâti. World — 世界のパティシエ業界ニュース</title>
<meta name="description" content="フランス・ベルギー・イタリア・日本・アメリカ・イギリス、世界の菓子業界の最新トピックをAIが集め日本語で届けるニュースサイト。">
<script>
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
  (function(){
    var active = true;
    var cancelArmed = false;
    function arm(){ cancelArmed = true; }
    ['touchstart', 'wheel'].forEach(function(ev){
      window.addEventListener(ev, function(){ if (cancelArmed) active = false; }, {passive:true});
    });
    var tries = 0;
    function forceTop(){
      if (!active) return;
      if (window.scrollY !== 0) window.scrollTo(0, 0);
      if (tries++ < 150) requestAnimationFrame(forceTop);
    }
    function restart(){
      tries = 0; active = true; cancelArmed = false;
      setTimeout(arm, 600);
      forceTop();
    }
    window.addEventListener('pageshow', restart);
    document.addEventListener('DOMContentLoaded', restart);
    window.addEventListener('load', restart);
    setTimeout(arm, 600);
    requestAnimationFrame(forceTop);
    window.__forceScrollTop = restart;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* layout: header -> sticky filter bar -> headline card grid -> footer */
    --bg: #F5F1EC;
    --bg-deep: #ECE4DA;
    --surface: #FFFDFB;
    --surface-2: #FBF6EF;
    --ink: #221C17;
    --ink-soft: #675C51;
    --ink-faint: #9C8F81;

    --framboise: #9B2C48;
    --framboise-ink: #6E1E33;
    --bleu: #2C5C7A;
    --bleu-ink: #1E4257;
    --or: #A9832E;
    --or-ink: #6E571C;

    --border: #E4D9CA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #17130F;
      --bg-deep: #0F0C09;
      --surface: #241E18;
      --surface-2: #2C241C;
      --ink: #F1E9DF;
      --ink-soft: #C9BAA8;
      --ink-faint: #8E7F6D;
      --framboise: #E08099;
      --framboise-ink: #F6CBD6;
      --bleu: #7FB4D6;
      --bleu-ink: #CFE4F0;
      --or: #D2AD5F;
      --or-ink: #EFD9A0;
      --border: #3A3023;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #17130F;
    --bg-deep: #0F0C09;
    --surface: #241E18;
    --surface-2: #2C241C;
    --ink: #F1E9DF;
    --ink-soft: #C9BAA8;
    --ink-faint: #8E7F6D;
    --framboise: #E08099;
    --framboise-ink: #F6CBD6;
    --bleu: #7FB4D6;
    --bleu-ink: #CFE4F0;
    --or: #D2AD5F;
    --or-ink: #EFD9A0;
    --border: #3A3023;
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  html{overflow-anchor:none}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-anchor:none;
  }
  a{color:inherit}
  img{max-width:100%; display:block}

  .wrap{
    max-width:1040px; margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  header.top{
    background:var(--bg-deep); border-bottom:1px solid var(--border);
    padding-block:22px 18px;
  }
  .brand{
    font-family:'Bodoni Moda', serif; font-weight:700; font-size:1.9rem;
    letter-spacing:-0.01em; margin:0; display:flex; align-items:baseline; gap:.3em;
    border:none; background:none; padding:0; color:inherit; cursor:pointer;
  }
  .brand .dot{color:var(--framboise)}
  .brand .world{color:var(--bleu); font-style:italic; font-weight:500}
  .tagline{
    margin:6px 0 0; font-size:.9rem; color:var(--ink-soft);
    font-family:'Space Mono', monospace; letter-spacing:.01em;
  }

  nav.filters{
    position:sticky; top:0; z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding-block:12px;
  }
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .filter-row + .filter-row{margin-top:8px}
  .chip{
    flex:none; font-family:'Work Sans', sans-serif; font-size:.82rem; font-weight:600;
    padding:7px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
  .chip .flag{margin-right:5px}

  main{padding-block:22px 48px}
  .count{
    font-family:'Space Mono', monospace; font-size:.78rem; color:var(--ink-faint);
    margin:0 0 14px;
  }

  .layout{display:flex; flex-wrap:wrap; gap:28px}
  .content{flex:999 1 560px; min-width:0; display:flex; flex-direction:column; gap:18px}

  .hero{
    display:block; border:1px solid var(--border); border-radius:16px;
    overflow:hidden; background:var(--surface); cursor:pointer;
  }
  .hero:focus-visible{outline:2px solid var(--framboise); outline-offset:2px}
  .hero .thumb{width:100%; aspect-ratio:16/8; object-fit:cover; background:var(--surface-2)}
  .hero .body{padding:20px 22px 22px; display:flex; flex-direction:column; gap:10px}
  .hero h2{
    font-family:'Bodoni Moda', serif; font-weight:700; font-size:1.5rem; line-height:1.4;
    margin:0; text-wrap:balance;
  }
  .hero .summary{font-size:.95rem; line-height:1.7; color:var(--ink-soft); margin:0}

  .badges{display:flex; gap:6px; flex-wrap:wrap}
  .badge{
    font-family:'Space Mono', monospace; font-size:.68rem; letter-spacing:.02em;
    padding:2px 8px; border-radius:999px; font-weight:700;
  }
  .badge.country{background:var(--bleu); color:var(--surface)}
  .badge.cat{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border)}

  .thumb-wrap{position:relative}
  .stock-label{
    position:absolute; right:12px; bottom:12px;
    font-family:'Space Mono', monospace; font-size:.66rem; font-weight:700;
    letter-spacing:.02em; color:#fff;
    background:rgba(20,16,12,.6); backdrop-filter:blur(2px);
    padding:4px 10px; border-radius:999px;
  }

  .meta{font-family:'Space Mono', monospace; font-size:.72rem; color:var(--ink-faint)}

  .headline-list{display:flex; flex-direction:column}
  .headline-row{
    display:flex; gap:14px; padding-block:14px; border-top:1px solid var(--border);
    cursor:pointer;
  }
  .headline-row:last-child{border-bottom:1px solid var(--border)}
  .headline-row:focus-visible{outline:2px solid var(--framboise); outline-offset:2px}
  .headline-row .thumb-sm{
    flex:none; width:72px; height:72px; border-radius:10px;
    object-fit:cover; background:var(--surface-2);
  }
  .headline-row .info{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
  .headline-row .kicker{font-family:'Space Mono', monospace; font-size:.66rem; color:var(--ink-faint)}
  .headline-row h3{
    font-family:'Bodoni Moda', serif; font-weight:600; font-size:.98rem; line-height:1.4;
    margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .headline-row .meta{font-size:.7rem}

  .sidebar{flex:1 1 240px; min-width:220px; max-width:280px; display:flex; flex-direction:column; gap:20px}
  .sidebar-box{border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:16px 18px}
  .sidebar-box .label{
    font-family:'Space Mono', monospace; font-size:.68rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 8px;
  }
  .sidebar-box button{
    display:flex; width:100%; justify-content:space-between; align-items:center;
    padding-block:7px; border:none; border-top:1px solid var(--border);
    background:none; font:inherit; color:inherit; text-align:left; cursor:pointer;
  }
  .sidebar-box button:last-child{border-bottom:1px solid var(--border)}
  .sidebar-box button[aria-pressed="true"]{color:var(--framboise-ink); font-weight:600}
  .sidebar-box button .n{font-family:'Space Mono', monospace; color:var(--ink-faint); font-size:.78rem}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
    font-family:'Space Mono', monospace; font-size:.85rem;
  }

  /* detail overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(10,8,6,.55); z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay[hidden]{display:none}
  .sheet{
    background:var(--surface); width:100%; max-width:640px; max-height:88vh;
    overflow-y:auto; border-radius:18px 18px 0 0;
    padding:0 0 max(24px, env(safe-area-inset-bottom,0px));
  }
  @media (min-width:640px){
    .overlay{align-items:center}
    .sheet{border-radius:18px; max-height:84vh}
  }
  .sheet .thumb{width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--surface-2)}
  .sheet-body{padding:20px 22px 4px}
  .sheet-close{
    position:sticky; top:10px; margin-left:calc(100% - 44px);
    width:34px; height:34px; border-radius:999px; border:none;
    background:rgba(20,16,12,.55); color:#fff; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:1;
  }
  .sheet h2{font-family:'Bodoni Moda', serif; font-size:1.5rem; line-height:1.4; margin:14px 0 10px; text-wrap:balance}
  .sheet .detail{font-size:.95rem; line-height:1.85; color:var(--ink); margin:0 0 18px}
  .sheet .src-link{
    display:inline-block; font-family:'Space Mono', monospace; font-size:.8rem;
    color:var(--framboise-ink); border-bottom:1px solid currentColor; margin-bottom:22px;
  }
  .chef-comment{
    background:var(--surface-2); border-left:3px solid var(--framboise);
    border-radius:10px; padding:14px 16px 16px; margin:0 0 18px;
  }
  .chef-comment .label{
    font-family:'Space Mono', monospace; font-size:.68rem; font-weight:700;
    letter-spacing:.03em; color:var(--framboise-ink); margin:0 0 8px;
  }
  .chef-comment p{font-size:.92rem; line-height:1.75; color:var(--ink); margin:0}

  footer{
    border-top:1px solid var(--border); padding-block:24px;
    font-family:'Space Mono', monospace; font-size:.72rem; color:var(--ink-faint);
    text-align:center;
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button type="button" class="brand" id="logoBtn" aria-label="トップページに戻る"><span class="name">P<span class="dot">â</span>ti.</span> <span class="world">World</span></button>
    <p class="tagline">世界の菓子業界ニュース、AIが毎日集めてお届け</p>
  </div>
</header>

<nav class="filters">
  <div class="wrap">
    <div class="filter-row" id="countryRow"></div>
    <div class="filter-row" id="catRow"></div>
  </div>
</nav>

<main class="wrap">
  <p class="count" id="count"></p>
  <div class="layout">
    <div class="content">
      <div id="hero"></div>
      <div class="headline-list" id="list"></div>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
  <p class="empty" id="empty" hidden>該当する記事はまだありません。</p>
</main>

<footer>Pâti. World — フランス・ベルギー・イタリア・日本・アメリカ・イギリスの菓子業界情報をAIが翻訳・要約してお届けします</footer>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script>
const COUNTRIES = [
  {id:'all', label:'すべて'},
  {id:'france', label:'フランス', flag:'🇫🇷'},
  {id:'belgium', label:'ベルギー', flag:'🇧🇪'},
  {id:'italy', label:'イタリア', flag:'🇮🇹'},
  {id:'japan', label:'日本', flag:'🇯🇵'},
  {id:'usa', label:'アメリカ', flag:'🇺🇸'},
  {id:'uk', label:'イギリス', flag:'🇬🇧'},
];
const CATS = [
  {id:'all', label:'すべてのカテゴリ'},
  {id:'collection', label:'新作コレクション'},
  {id:'craft', label:'職人技'},
  {id:'people', label:'人物'},
  {id:'event', label:'コンクール・イベント'},
  {id:'design', label:'デザイン'},
];
const PH_GRADIENTS = {
  design: 'linear-gradient(135deg, #C24A69, #6E1E33)',
  craft: 'linear-gradient(135deg, #7FA075, #33461F)',
  collection: 'linear-gradient(135deg, #C7A24B, #6E571C)',
  people: 'linear-gradient(135deg, #6E5B64, #362A31)',
  event: 'linear-gradient(135deg, #A94A5C, #4E1620)',
};

let ARTICLES = [];
let activeCountry = 'all';
let activeCat = 'all';

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeUrl(u){
  try {
    const parsed = new URL(String(u ?? ''), location.href);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return escapeHtml(u);
  } catch(e) {}
  return '#';
}

function renderFilters(){
  const cRow = document.getElementById('countryRow');
  cRow.innerHTML = COUNTRIES.map(c => `
    <button class="chip" data-country="${c.id}" aria-pressed="${c.id===activeCountry}">
      ${c.flag ? `<span class="flag">${c.flag}</span>` : ''}${c.label}
    </button>`).join('');
  const kRow = document.getElementById('catRow');
  kRow.innerHTML = CATS.map(k => `
    <button class="chip" data-cat="${k.id}" aria-pressed="${k.id===activeCat}">${k.label}</button>`).join('');

  cRow.querySelectorAll('[data-country]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCountry = btn.dataset.country; renderFilters(); renderGrid(); });
  });
  kRow.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; renderFilters(); renderGrid(); });
  });

  renderSidebar();
}

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const countryCounts = {};
  const catCounts = {};
  ARTICLES.forEach(a=>{
    countryCounts[a.country] = (countryCounts[a.country] || 0) + 1;
    catCounts[a.cat] = (catCounts[a.cat] || 0) + 1;
  });

  const countryRows = COUNTRIES
    .filter(c => c.id !== 'all' && countryCounts[c.id])
    .sort((a, b) => countryCounts[b.id] - countryCounts[a.id])
    .map(c => `
      <button data-country="${c.id}" aria-pressed="${activeCountry === c.id}">
        <span>${c.flag} ${c.label}</span><span class="n">${countryCounts[c.id]}</span>
      </button>`).join('');

  const catRows = CATS
    .filter(k => k.id !== 'all' && catCounts[k.id])
    .sort((a, b) => catCounts[b.id] - catCounts[a.id])
    .map(k => `
      <button data-cat="${k.id}" aria-pressed="${activeCat === k.id}">
        <span>${k.label}</span><span class="n">${catCounts[k.id]}</span>
      </button>`).join('');

  sidebar.innerHTML = `
    <div class="sidebar-box">
      <p class="label">国でさがす</p>
      ${countryRows}
    </div>
    <div class="sidebar-box">
      <p class="label">カテゴリでさがす</p>
      ${catRows}
    </div>
  `;

  sidebar.querySelectorAll('[data-country]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCountry = btn.dataset.country; renderFilters(); renderGrid(); });
  });
  sidebar.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; renderFilters(); renderGrid(); });
  });
}

function countryLabel(id){
  const c = COUNTRIES.find(x=>x.id===id);
  return escapeHtml(c ? c.label : id);
}
function catLabel(id){
  const k = CATS.find(x=>x.id===id);
  return escapeHtml(k ? k.label : id);
}

function thumbHtml(a, cls){
  if (a.image) return `<img class="${cls}" src="${escapeHtml(a.image)}" alt="" loading="lazy">`;
  const grad = PH_GRADIENTS[a.cat] || PH_GRADIENTS.collection;
  return `<div class="${cls}" style="background:${grad}"></div>`;
}

function isStockImage(a){
  return !!(a.image && a.image.indexOf('images/stock/') === 0);
}
function labeledThumb(innerHtml, a){
  if(!isStockImage(a)) return innerHtml;
  return `<div class="thumb-wrap">${innerHtml}<span class="stock-label">イメージ</span></div>`;
}

function heroHtml(a){
  return `
    <article class="hero" tabindex="0" role="button" data-idx="${ARTICLES.indexOf(a)}">
      ${labeledThumb(thumbHtml(a, 'thumb'), a)}
      <div class="body">
        <div class="badges">
          <span class="badge country">${countryLabel(a.country)}</span>
          <span class="badge cat">${catLabel(a.cat)}</span>
        </div>
        <h2>${escapeHtml(a.title)}</h2>
        <p class="summary">${escapeHtml(a.summary)}</p>
        <div class="meta">${escapeHtml(a.source)} ・ ${escapeHtml(a.addedAt)}</div>
      </div>
    </article>
  `;
}

function headlineRowHtml(a){
  const flag = (COUNTRIES.find(c => c.id === a.country) || {}).flag || '';
  return `
    <article class="headline-row" tabindex="0" role="button" data-idx="${ARTICLES.indexOf(a)}">
      ${thumbHtml(a, 'thumb-sm')}
      <div class="info">
        <div class="kicker">${flag} ${countryLabel(a.country)} ・ ${catLabel(a.cat)}</div>
        <h3>${escapeHtml(a.title)}</h3>
        <div class="meta">${escapeHtml(a.source)} ・ ${escapeHtml(a.addedAt)}</div>
      </div>
    </article>
  `;
}

function renderGrid(){
  const filtered = ARTICLES.filter(a =>
    (activeCountry==='all' || a.country===activeCountry) &&
    (activeCat==='all' || a.cat===activeCat)
  ).sort((a,b)=> b.addedAt.localeCompare(a.addedAt));

  document.getElementById('count').textContent = `${filtered.length}件の記事`;
  const heroEl = document.getElementById('hero');
  const listEl = document.getElementById('list');
  const empty = document.getElementById('empty');

  if(filtered.length===0){
    heroEl.innerHTML = '';
    listEl.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  // The lead story only makes sense on the unfiltered home view; a
  // filtered view (one country or category) shows a plain headline list.
  const showHero = activeCountry==='all' && activeCat==='all';
  const hero = showHero ? filtered[0] : null;
  const rest = showHero ? filtered.slice(1) : filtered;

  heroEl.innerHTML = hero ? heroHtml(hero) : '';
  listEl.innerHTML = rest.map(headlineRowHtml).join('');

  [heroEl, listEl].forEach(container=>{
    container.querySelectorAll('[data-idx]').forEach(el=>{
      const open = ()=> openDetail(ARTICLES[el.dataset.idx]);
      el.addEventListener('click', open);
      el.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });
    });
  });
}

function openDetail(a){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <button class="sheet-close" id="sheetClose" aria-label="閉じる">✕</button>
    ${a.image ? labeledThumb(`<img class="thumb" src="${escapeHtml(a.image)}" alt="">`, a) : ''}
    <div class="sheet-body">
      <div class="badges">
        <span class="badge country">${countryLabel(a.country)}</span>
        <span class="badge cat">${catLabel(a.cat)}</span>
      </div>
      <h2>${escapeHtml(a.title)}</h2>
      <p class="detail">${escapeHtml(a.detail)}</p>
      ${a.chefComment ? `
      <div class="chef-comment">
        <p class="label">ニュース解説</p>
        <p>${escapeHtml(a.chefComment)}</p>
      </div>` : ''}
      <a class="src-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">原文を読む(${escapeHtml(a.source)})↗</a>
    </div>
  `;
  overlay.hidden = false;
  document.getElementById('sheetClose').addEventListener('click', closeDetail);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDetail(); }, {once:true});
}
function closeDetail(){
  document.getElementById('overlay').hidden = true;
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeDetail();
});

document.getElementById('logoBtn').addEventListener('click', ()=>{
  activeCountry = 'all';
  activeCat = 'all';
  closeDetail();
  renderFilters();
  renderGrid();
  window.scrollTo({top:0, behavior:'smooth'});
});

fetch('articles.json')
  .then(r=>r.json())
  .then(data=>{
    ARTICLES = data;
    renderFilters();
    renderGrid();
    if (window.__forceScrollTop) window.__forceScrollTop();
  })
  .catch(()=>{
    document.getElementById('count').textContent = '';
    document.getElementById('empty').hidden = false;
    document.getElementById('empty').textContent = '記事データの読み込みに失敗しました。';
  });
</script>

</body>
</html>
